<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B2B4B" />
    <meta name="description" content="Dawaa Pharmacy 2027 - نظام تشغيل الصيدلية الذكي" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dawaa 2027" />
    <title>Dawaa Pharmacy 2027 — نظام تشغيل الصيدلية الذكي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/customer-requests-layout.css" />
    <!-- Security: conservative Content Security Policy and other headers -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https: wss: https://*.supabase.co wss://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; frame-ancestors 'none';"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Permissions-Policy"
      content="geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()"
    />
  </head>
  <body>
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('dawaa_theme');
          var allowed = ['light', 'dark', 'pharmacy-green'];
          var theme = allowed.indexOf(storedTheme) >= 0
            ? storedTheme
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.classList.remove('light-mode', 'dark-mode', 'theme-light', 'theme-dark', 'theme-pharmacy-green', 'dark');
          root.classList.add(theme === 'light' ? 'theme-light' : theme === 'pharmacy-green' ? 'theme-pharmacy-green' : 'theme-dark');
          if (theme === 'dark') root.classList.add('dark');
          root.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
          root.removeAttribute('data-palette');
          localStorage.removeItem('dawaa_palette');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.classList.add('theme-dark', 'dark');
          document.documentElement.style.colorScheme = 'dark';
          document.documentElement.removeAttribute('data-palette');
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var reviewDraftKey = 'dawaa_conversation_review_draft_v3';
          var rawDraft = localStorage.getItem(reviewDraftKey);
          if (rawDraft) {
            var draft = JSON.parse(rawDraft);
            var state = draft && draft.reviewState && typeof draft.reviewState === 'object'
              ? draft.reviewState
              : {};
            var defaults = {
              first_response_speed: { applies: true, choice: 'within_5', notes: '' },
              greeting: { applies: true, choice: 'official_full', notes: '' },
              doctor_name: { applies: true, choice: 'start', notes: '' },
              customer_name: { applies: false, choice: 'used', notes: '' },
              tone: { applies: true, choice: 'professional', notes: '' },
              understanding: { applies: true, choice: 'strong', notes: '' },
              followup_after_wait: { applies: false, choice: 'within_5', notes: '' },
              consultation_quality: { applies: false, choice: 'excellent', notes: '' },
              dosage_explanation: { applies: false, choice: 'clear', notes: '' },
              unavailable_items: { applies: false, choice: 'good_alternative', notes: '' },
              sales_closing: { applies: true, choice: 'closed', notes: '' },
              cross_sell_upsell: { applies: false, choice: 'successful', notes: '' },
              angry_customer: { applies: false, choice: 'excellent', notes: '' },
              order_confirmation: { applies: false, choice: 'complete', notes: '' },
              order_delay_handling: { applies: false, choice: 'no_delay', notes: '' },
              customer_request_registration: { applies: false, choice: 'registered', notes: '' },
              closing_message: { applies: true, choice: 'official', notes: '' }
            };
            Object.keys(defaults).forEach(function (key) {
              var current = state[key];
              if (!current || typeof current !== 'object') {
                state[key] = defaults[key];
                return;
              }
              if (typeof current.applies !== 'boolean') current.applies = defaults[key].applies;
              if (typeof current.choice !== 'string' || !current.choice) current.choice = defaults[key].choice;
              if (typeof current.notes !== 'string') current.notes = '';
            });
            draft.reviewState = state;
            localStorage.setItem(reviewDraftKey, JSON.stringify(draft));
          }
        } catch (error) {
          try { localStorage.removeItem('dawaa_conversation_review_draft_v3'); } catch (ignore) {}
        }

        try {
          var settingsKey = 'dawaa_notification_settings_v1';
          var savedSettings = JSON.parse(localStorage.getItem(settingsKey) || '{}');
          var notificationDefaults = {
            customerService: true,
            delivery: true,
            inventory: true,
            reviews: true,
            attendance: true,
            targets: true,
            highPriorityOnly: false,
            sound: 'soft',
            retentionDays: 30
          };
          var normalizedSettings = Object.assign({}, notificationDefaults, savedSettings || {});
          if (['off', 'soft', 'distinct'].indexOf(normalizedSettings.sound) === -1) normalizedSettings.sound = 'soft';
          var retention = Number(normalizedSettings.retentionDays);
          normalizedSettings.retentionDays = Number.isFinite(retention) && retention > 0 ? Math.min(Math.round(retention), 365) : 30;
          ['customerService', 'delivery', 'inventory', 'reviews', 'attendance', 'targets', 'highPriorityOnly'].forEach(function (key) {
            normalizedSettings[key] = typeof normalizedSettings[key] === 'boolean' ? normalizedSettings[key] : notificationDefaults[key];
          });
          localStorage.setItem(settingsKey, JSON.stringify(normalizedSettings));
        } catch (error) {
          try { localStorage.removeItem('dawaa_notification_settings_v1'); } catch (ignore) {}
        }
      })();
    </script>
    <div id="root"></div>
    <script>
      (function () {
        // Recovery is a last-resort guard. Weak pharmacy networks and heavy dashboards can
        // legitimately take several seconds, so normal slowness must not be treated as logout.
        var RECOVERY_DELAY_MS = 20000;
        var shown = false;

        function recoveryUrl(path, reason) {
          var url = new URL(path, window.location.origin);
          url.searchParams.set('_recovery', reason + '_' + Date.now());
          return url.toString();
        }

        function cleanupInBackground(clearStorage) {
          try {
            if (window.caches) {
              window.caches.keys().then(function (keys) {
                console.info('[Dawaa sw] cache names found', keys);
                return Promise.all(keys.map(function (key) { return window.caches.delete(key); }));
              }).catch(function (error) { console.warn('[Dawaa recovery] cache cleanup failed', error); });
            }
          } catch (error) {
            console.warn('[Dawaa recovery] cache cleanup failed', error);
          }

          try {
            if (navigator.serviceWorker) {
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                console.info('[Dawaa sw] registrations found/removed', registrations.length);
                return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
              }).catch(function (error) { console.warn('[Dawaa recovery] sw cleanup failed', error); });
            }
          } catch (error) {
            console.warn('[Dawaa recovery] sw cleanup failed', error);
          }

          if (!clearStorage) return;
          try {
            ['localStorage', 'sessionStorage'].forEach(function (storageName) {
              var storage = window[storageName];
              var keys = [];
              for (var index = 0; index < storage.length; index += 1) {
                var key = storage.key(index);
                if (/^(dawA|dawaA|dawaa|supabase|sb-)/.test(key || '')) keys.push(key);
              }
              keys.forEach(function (key) { storage.removeItem(key); });
            });
          } catch (error) {
            console.warn('[Dawaa recovery] storage cleanup failed', error);
          }
        }

        function showRecovery(reason, detail) {
          if (shown || window.__DAWAA_REACT_BOOTSTRAPPED) return;
          shown = true;
          try {
            sessionStorage.setItem('dawA_last_runtime_error', JSON.stringify({
              source: 'index recovery',
              message: detail || reason,
              at: new Date().toISOString()
            }));
          } catch (error) {}

          var loginUrl = recoveryUrl('/login', reason);
          var cleanLoginUrl = recoveryUrl('/login', reason + '_clean');
          var diagnosticsUrl = recoveryUrl('/diagnostics', reason);
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<main dir="rtl" style="min-height:100vh;background:var(--dawaa-theme-bg,#081014);color:var(--dawaa-theme-text,#d9e5e9);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Cairo,Tajawal,system-ui,sans-serif">' +
              '<section style="width:100%;max-width:520px;background:var(--dawaa-theme-surface,#101b21);border:1px solid var(--dawaa-theme-border,rgba(160,181,190,.14));border-radius:18px;padding:24px;text-align:center;box-shadow:var(--dawaa-theme-shadow,0 18px 42px rgba(0,0,0,.3))">' +
                '<div style="margin:0 auto 14px;width:54px;height:54px;border-radius:16px;background:var(--dawaa-theme-soft,rgba(37,188,169,.09));display:grid;place-items:center;font-size:28px;color:var(--dawaa-theme-primary,#25bca9)">!</div>' +
                '<h1 style="margin:0;font-size:24px;font-weight:900;color:var(--dawaa-theme-heading,#f7fafb)">تعذر إكمال تحميل التطبيق</h1>' +
                '<p style="margin:12px 0 0;color:var(--dawaa-theme-muted,#91a4ad);line-height:1.8;font-size:14px">جلستك محفوظة. ابدأ بإعادة المحاولة أو إصلاح كاش التشغيل؛ التنظيف الكامل وتسجيل الدخول من جديد مطلوبان فقط إذا استمرت المشكلة.</p>' +
                '<div style="display:grid;gap:10px;margin-top:22px">' +
                  '<a id="dawaa-index-retry" href="#" style="background:var(--dawaa-theme-primary,#25bca9);color:var(--dawaa-theme-primary-text,#031b1d);text-decoration:none;border-radius:12px;padding:13px 16px;font-weight:900">إعادة المحاولة</a>' +
                  '<a id="dawaa-index-repair" href="#" style="background:var(--dawaa-theme-surface-2,#15242b);border:1px solid var(--dawaa-theme-border-strong,rgba(62,192,176,.34));color:var(--dawaa-theme-heading,#f7fafb);text-decoration:none;border-radius:12px;padding:13px 16px;font-weight:900">إصلاح كاش التشغيل بدون تسجيل خروج</a>' +
                  '<a href="' + diagnosticsUrl + '" style="border:1px solid var(--dawaa-theme-border,#334155);color:var(--dawaa-theme-text,#d9e5e9);text-decoration:none;border-radius:12px;padding:13px 16px;font-weight:900">فتح التشخيص</a>' +
                  '<a id="dawaa-index-clean" href="' + cleanLoginUrl + '" style="background:var(--dawaa-status-warning-bg,rgba(236,175,63,.09));border:1px solid var(--dawaa-status-warning-border,rgba(230,174,69,.23));color:var(--dawaa-status-warning-text,#e9c26f);text-decoration:none;border-radius:12px;padding:13px 16px;font-weight:900">تنظيف كامل وتسجيل الدخول من جديد</a>' +
                  '<a href="' + loginUrl + '" style="color:var(--dawaa-theme-muted,#91a4ad);text-decoration:none;padding:8px 12px;font-weight:700;font-size:12px">فتح صفحة تسجيل الدخول فقط</a>' +
                '</div>' +
              '</section>' +
            '</main>';

          var retry = document.getElementById('dawaa-index-retry');
          var repair = document.getElementById('dawaa-index-repair');
          var clean = document.getElementById('dawaa-index-clean');
          if (retry) {
            retry.addEventListener('click', function (event) {
              event.preventDefault();
              window.location.reload();
            });
          }
          if (repair) {
            repair.addEventListener('click', function (event) {
              event.preventDefault();
              cleanupInBackground(false);
              window.setTimeout(function () { window.location.reload(); }, 250);
            });
          }
          if (clean) {
            clean.addEventListener('click', function () {
              cleanupInBackground(true);
              console.info('[Dawaa recovery] full cleanup requested', cleanLoginUrl);
            });
          }
        }

        window.addEventListener('error', function (event) {
          var target = event.target;
          var isScriptFailure = target && target !== window && target.tagName === 'SCRIPT';
          var isCriticalStylesheetFailure = target && target !== window && target.tagName === 'LINK' && String(target.rel || '').toLowerCase() === 'stylesheet' && String(target.href || '').indexOf(window.location.origin) === 0;
          var isAssetFailure = isScriptFailure || isCriticalStylesheetFailure;
          var message = event.message || (isAssetFailure ? 'asset load failed' : '');
          if (isAssetFailure || /module|script|chunk|CSP|Content Security Policy/i.test(message)) {
            showRecovery('module_error', message || 'critical asset load failed');
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var message = reason && reason.message ? reason.message : String(reason || '');
          if (/module|chunk|dynamically imported|Failed to fetch/i.test(message)) {
            showRecovery('module_rejection', message);
          }
        });

        window.setTimeout(function () {
          var root = document.getElementById('root');
          var text = root ? (root.textContent || '').trim() : '';
          if (!root || !text || /جاري التحميل|loading/i.test(text)) {
            showRecovery('startup_timeout', text || 'empty root');
          }
        }, RECOVERY_DELAY_MS);
      })();
    </script>
    <script defer src="/customer-requests-sync-refresh.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- SW SKIP_WAITING handler -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function (e) {
          if (e.data && e.data.type === 'SKIP_WAITING') {
            navigator.serviceWorker.getRegistration().then(function (reg) {
              if (reg && reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            });
          }
        });
      }
    </script>
  </body>
</html>
