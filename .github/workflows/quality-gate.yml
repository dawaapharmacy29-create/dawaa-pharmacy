name: Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify targeted repairs are idempotent
        run: |
          node scripts/audit-fix-semantic-lint.cjs
          if ! git diff --quiet -- src; then
            echo "Targeted repair script still changes committed source files."
            git diff --stat
            git diff
            exit 1
          fi

      - name: Environment doctor
        run: npm run doctor

      - name: Tests
        run: npm run test

      - name: Architecture data-access boundary
        run: node scripts/check-data-access-boundaries.cjs

      - name: TypeScript
        run: npm run typecheck

      - name: Semantic lint
        id: semantic_lint
        continue-on-error: true
        run: |
          npx eslint . --ext .ts,.tsx --ignore-path .eslintignore --quiet \
            --rule 'prettier/prettier: off' \
            --format json --output-file eslint-semantic-report.json

      - name: Upload semantic lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-lint-report
          path: eslint-semantic-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce semantic lint
        if: steps.semantic_lint.outcome == 'failure'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('eslint-semantic-report.json', 'utf8'));
          for (const row of rows) {
            for (const message of row.messages || []) {
              console.error(`${row.filePath}:${message.line}:${message.column} ${message.ruleId} ${message.message}`);
            }
          }
          process.exit(1);
          NODE

      - name: Verify checks did not mutate tracked files
        run: |
          if ! git diff --quiet; then
            echo "Tests, typecheck, lint, or architecture checks changed tracked repository files before build."
            git status --short
            git diff --stat
            git diff
            exit 1
          fi

      - name: Production build
        run: npm run build

      - name: Runtime performance budget
        run: npm run perf:budget

      - name: Capture repository mutation diagnostics
        if: always()
        run: |
          git status --short > repository-mutation-status.txt
          git diff --name-only >> repository-mutation-status.txt
          git diff --stat >> repository-mutation-status.txt
          git diff >> repository-mutation-status.txt

      - name: Upload repository mutation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-mutation-status
          path: repository-mutation-status.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify production build is source-pure
        run: |
          if ! git diff --quiet; then
            echo "Architecture violation: production build changed tracked repository files."
            echo "Build/prebuild steps must validate canonical source, never patch it."
            git status --short
            git diff --stat
            git diff
            exit 1
          fi
          echo "Production build left tracked repository source clean."
