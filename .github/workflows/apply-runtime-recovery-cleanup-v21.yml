name: Apply runtime recovery cleanup V21

on:
  push:
    branches:
      - agent/runtime-recovery-cleanup-v21

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-recovery-v21-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-recovery-cleanup-v21
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply runtime recovery cleanup
        run: node scripts/apply-runtime-recovery-cleanup-v21.cjs
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/lib/appRecovery.ts src/main.tsx src/components/system/AppHealthBanner.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "إصلاح تنبيهات وأخطاء تحميل الأصول [runtime-recovery-v21-applied]"
          git push origin HEAD:agent/runtime-recovery-cleanup-v21
