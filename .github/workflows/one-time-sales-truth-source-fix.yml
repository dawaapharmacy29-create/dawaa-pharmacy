name: One-time sales truth source fix

on:
  push:
    branches:
      - fix/sales-truth-end-to-end-20260821
    paths:
      - .github/workflows/one-time-sales-truth-source-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sales-truth-end-to-end-20260821
          fetch-depth: 0
      - name: Apply exact deterministic replacements
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('src/lib/doctorCompetitionMetrics.ts'): [
                  (
                      "const SYSTEM_GENERIC_CUSTOMER_CODES = new Set(['54', '4902', '20', '12820', '10', '170', '5']);",
                      "const SYSTEM_GENERIC_CUSTOMER_CODES = new Set(['54', '12820', '10', '170', '5']);",
                  ),
              ],
              Path('src/lib/salesInvoiceQueries.ts'): [
                  (
                      "return `${base}:truth-v24:p${options.pageSize || DEFAULT_PAGE_SIZE}:s${stableHash(projection)}`;",
                      "return `${base}:truth-v25-sales-recovery-20260821:p${options.pageSize || DEFAULT_PAGE_SIZE}:s${stableHash(projection)}`;",
                  ),
              ],
          }

          for path, items in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in items:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match, got {count}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/one-time-sales-truth-source-fix.yml').unlink()
      - name: Commit patched sources
        run: |
          git config user.name "Dawaa Sales Truth Bot"
          git config user.email "sales-truth@dawaapharmacy.local"
          git add -A
          git diff --cached --check
          git commit -m "Align competition and invoice caches with sales truth"
          git push origin HEAD:fix/sales-truth-end-to-end-20260821
