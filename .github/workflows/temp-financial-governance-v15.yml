name: Temp Financial Governance V15

on:
  push:
    branches:
      - fix/si-quality-closing-continuation-20261004
    paths:
      - '.github/workflows/temp-financial-governance-v15.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/si-quality-closing-continuation-20261004
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic financial governance patch
        run: python3 scripts/temp_apply_financial_governance_v15.py

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run configured regression suite
        run: node scripts/run-tests.cjs

      - name: TypeScript gate
        run: npx tsc --noEmit

      - name: Regenerate canonical Sales Intelligence API
        run: node scripts/build-sales-intelligence-refresh-api.cjs

      - name: Verify generated API is canonical
        run: node scripts/build-sales-intelligence-refresh-api.cjs --check

      - name: Verify V15 financial governance markers
        run: |
          grep -q "sales-intelligence-v15" src/lib/salesIntelligence/persistence/versions.ts
          grep -q "case-segmentation-v10-payment-continuation-ambiguity-safe" src/lib/salesIntelligence/persistence/versions.ts
          grep -q "financialSettlement.needsHumanReview" src/lib/salesIntelligence/salesIntelligencePipeline.ts
          grep -q "near_amount_requires_review" src/lib/salesIntelligence/financialSettlementEngine.ts
          grep -q "payment_amount_conflicts_with_selected_invoice" src/lib/salesIntelligence/qa/labels.ts

      - name: Commit verified result and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/temp_apply_financial_governance_v15.py
          rm -f .github/workflows/temp-financial-governance-v15.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: surface V15 financial settlement review gates"
          git push origin HEAD:fix/si-quality-closing-continuation-20261004
