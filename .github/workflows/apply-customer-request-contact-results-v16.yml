name: Apply customer request contact results V16

on:
  push:
    branches:
      - agent/customer-request-contact-results-v16

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[contact-results-v16-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-request-contact-results-v16
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply contact results transformation
        run: node scripts/apply-customer-request-contact-results-v16-fix.cjs
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomerRequests.tsx src/lib/api/customerRequests.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "إضافة تسجيل سريع لنتيجة التواصل [contact-results-v16-applied]"
          git push origin HEAD:agent/customer-request-contact-results-v16
