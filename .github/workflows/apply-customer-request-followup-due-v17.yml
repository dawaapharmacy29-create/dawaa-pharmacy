name: Apply customer request follow-up due V17

on:
  push:
    branches:
      - agent/customer-request-followup-due-v17

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[followup-due-v17-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-request-followup-due-v17
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply follow-up due transformation
        run: node scripts/apply-customer-request-followup-due-v17.cjs
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomerRequests.tsx src/lib/api/customerRequests.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "إضافة موعد متابعة منظم لطلبات العملاء [followup-due-v17-applied]"
          git push origin HEAD:agent/customer-request-followup-due-v17
