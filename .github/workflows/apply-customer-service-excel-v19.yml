name: Apply customer service Excel V19

on:
  push:
    branches:
      - agent/customer-service-excel-v19

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[customer-service-excel-v19-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-service-excel-v19
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ExcelJS
        run: npm install exceljs --save --legacy-peer-deps --no-audit --no-fund
      - name: Apply customer service Excel transformation
        run: node scripts/apply-customer-service-excel-v19.cjs
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/components/customerService/CustomerDailyPriorityQueues.tsx src/components/customerService/SmartQueueExcelImportModal.tsx src/lib/customerService/customerServiceExcelWorkbook.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "تطوير شامل لتصدير واستيراد Excel متابعة العملاء [customer-service-excel-v19-applied]"
          git push origin HEAD:agent/customer-service-excel-v19
