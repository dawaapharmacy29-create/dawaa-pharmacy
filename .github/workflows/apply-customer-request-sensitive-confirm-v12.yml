name: Apply customer request sensitive confirmation V12

on:
  push:
    branches:
      - agent/customer-request-sensitive-confirm-v12

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[sensitive-confirm-v12-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-request-sensitive-confirm-v12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply sensitive confirmation transformation
        run: node scripts/apply-customer-request-sensitive-confirm-v12.cjs
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomerRequests.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "إضافة تأكيد ذكي قبل التسليم النهائي [sensitive-confirm-v12-applied]"
          git push origin HEAD:agent/customer-request-sensitive-confirm-v12
