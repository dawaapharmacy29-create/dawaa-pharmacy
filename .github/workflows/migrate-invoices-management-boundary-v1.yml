name: Invoices Management Boundary Migration V1

on:
  push:
    branches:
      - architecture/stability-phase-1

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[invoices-management-boundary-v1-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: node scripts/migrate-invoices-management-boundary-v1.cjs
      - run: node scripts/check-data-access-boundaries.cjs
      - run: node scripts/audit-theme-debt.cjs
      - run: npm run typecheck
      - run: npm run build
      - name: Commit canonical boundary migration
        run: |
          if git diff --quiet -- src/pages/Invoices.tsx src/lib/invoices/invoiceManagementService.ts scripts/check-data-access-boundaries.cjs; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Invoices.tsx src/lib/invoices/invoiceManagementService.ts scripts/check-data-access-boundaries.cjs
          git commit -m "فصل إدارة الفواتير عن واجهة الصفحة [invoices-management-boundary-v1-applied]"
          git push
