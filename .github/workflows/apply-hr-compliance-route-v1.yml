name: Apply HR compliance route v1

on:
  push:
    branches:
      - feat/hr-compliance-center-v1
    paths:
      - scripts/patch-hr-compliance-route-v1.cjs
      - .github/workflows/apply-hr-compliance-route-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hr-compliance-center-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply route patch
        run: node scripts/patch-hr-compliance-route-v1.cjs
      - name: Remove one-time patch helpers
        run: rm -f scripts/patch-hr-compliance-route-v1.cjs .github/workflows/apply-hr-compliance-route-v1.yml
      - name: Commit verified wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/layout/SidebarBase.tsx src/components/layout/Layout.tsx scripts/patch-hr-compliance-route-v1.cjs .github/workflows/apply-hr-compliance-route-v1.yml
          git commit -m "feat(hr): wire compliance center into app navigation" || exit 0
          git push origin HEAD:feat/hr-compliance-center-v1
