name: WhatsApp V49 Regenerate Generated Server Bundle (Temporary)
on:
  push:
    branches:
      - fix/whatsapp-v49-complaint-negation-20261113
    paths:
      - .github/workflows/whatsapp-v49-regenerate-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: node scripts/build-sales-intelligence-refresh-api.cjs
      - name: Commit generated file to this fix branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/sales-intelligence-refresh-source.js
          if git diff --cached --quiet; then
            echo 'Generated bundle already current'
          else
            git commit -m 'build(whatsapp): regenerate canonical refresh server bundle'
            git push origin HEAD:fix/whatsapp-v49-complaint-negation-20261113
          fi
