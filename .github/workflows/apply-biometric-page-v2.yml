name: Apply biometric attendance page v2

on:
  push:
    branches: [agent/biometric-page-v2]
    paths:
      - 'scripts/patch-biometric-page-v2.cjs'
      - '.github/workflows/apply-biometric-page-v2.yml'

permissions:
  contents: write

jobs:
  patch-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biometric-page-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: node scripts/patch-biometric-page-v2.cjs
      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Performance budget
        run: npm run perf:budget
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898218+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AttendanceReport.tsx
          git commit -m "feat: apply biometric page v2" || exit 0
          git push origin HEAD:agent/biometric-page-v2
