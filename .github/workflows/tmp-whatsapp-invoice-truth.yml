name: Temporary WhatsApp invoice truth migration
on:
  push:
    branches: [arch/whatsapp-invoice-truth-v1]
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message == 'chore: run targeted WhatsApp invoice truth migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/whatsapp-invoice-truth-v1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply targeted migration
        shell: python
        run: |
          from pathlib import Path

          page = Path('src/pages/WhatsappAnalytics.tsx')
          text = page.read_text(encoding='utf-8-sig')
          old_import = "import { useStaffDirectory } from '@/hooks/useStaffDirectory';\nimport { useSupabaseQuery } from '@/hooks/useSupabaseQuery';"
          new_import = "import { useStaffDirectory } from '@/hooks/useStaffDirectory';\nimport { useSalesInvoiceTruth } from '@/hooks/useSalesInvoiceTruth';\nimport { useSupabaseQuery } from '@/hooks/useSupabaseQuery';"
          if old_import not in text:
              raise SystemExit('WhatsappAnalytics import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_query = """  const { data: invoices, loading: invoicesLoading, error: invoicesError } = useSupabaseQuery<Row>({\n    table: 'sales_invoices',\n    limit: 5000,\n    realtimeEnabled: false,\n  });"""
          new_query = """  const { data: invoices, loading: invoicesLoading, error: invoicesError } = useSalesInvoiceTruth<Row>({\n    startDate,\n    endDate,\n    branch,\n  });"""
          if old_query not in text:
              raise SystemExit('WhatsappAnalytics invoice query anchor not found')
          text = text.replace(old_query, new_query, 1)
          page.write_text(text, encoding='utf-8')

          gate = Path('scripts/check-generic-query-data-access.cjs')
          gate_text = gate.read_text(encoding='utf-8')
          debt_line = "  'src/pages/WhatsappAnalytics.tsx',\n"
          invoice_start = gate_text.index('const LEGACY_GENERIC_INVOICE_UI_READERS')
          invoice_end = gate_text.index(']);', invoice_start)
          invoice_block = gate_text[invoice_start:invoice_end]
          if debt_line not in invoice_block:
              raise SystemExit('WhatsApp invoice debt entry not found in invoice register')
          invoice_block = invoice_block.replace(debt_line, '', 1)
          gate_text = gate_text[:invoice_start] + invoice_block + gate_text[invoice_end:]
          gate.write_text(gate_text, encoding='utf-8')

          Path('.github/workflows/tmp-whatsapp-invoice-truth.yml').unlink()
      - name: Commit migration
        run: |
          git config user.name "dawaa-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/WhatsappAnalytics.tsx src/hooks/useSalesInvoiceTruth.ts scripts/check-generic-query-data-access.cjs .github/workflows/tmp-whatsapp-invoice-truth.yml
          git commit -m "refactor: route WhatsApp invoice reads through sales truth"
          git push origin HEAD:arch/whatsapp-invoice-truth-v1
