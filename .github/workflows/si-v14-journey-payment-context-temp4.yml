name: SI V14 Journey Payment Context Temp 4

on:
  push:
    branches:
      - fix/si-quality-closing-continuation-20261004

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/si-quality-closing-continuation-20261004
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Apply source repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/si_v14_patch_temp.py')
          s = p.read_text()
          p.write_text(s.split('# 4) Isolated regression tests')[0])
          PY
          python3 .github/si_v14_patch_temp.py
      - name: Write isolated regression test
        run: |
          echo '' | base64 -d > src/lib/salesIntelligence/refresh/__tests__/canonicalJourneyPaymentContext.test.ts
      - name: Focused regression tests
        run: npx vitest run src/lib/__tests__/whatsappConversationUnderstandingV32.test.ts src/lib/salesIntelligence/refresh/__tests__/canonicalJourneyPaymentContext.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Generate canonical Sales Intelligence API
        run: node scripts/build-sales-intelligence-refresh-api.cjs
      - name: Verify generated API
        run: |
          grep -q 'sales-intelligence-v14' api/sales-intelligence-refresh-source.js
          grep -q 'case-segmentation-v9-payment-settlement-continuation' api/sales-intelligence-refresh-source.js
          grep -q 'buildCanonicalAnalysisConversations' api/sales-intelligence-refresh-source.js
      - name: Commit repair and clean temp files
        run: |
          rm -f .github/workflows/si-v14-journey-payment-context-temp.yml
          rm -f .github/workflows/si-v14-journey-payment-context-temp2.yml
          rm -f .github/workflows/si-v14-journey-payment-context-temp3.yml
          rm -f .github/workflows/si-v14-journey-payment-context-temp4.yml
          rm -f .github/si_v14_patch_temp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: reassemble payment continuation for SI analysis'
          git push origin HEAD:fix/si-quality-closing-continuation-20261004
