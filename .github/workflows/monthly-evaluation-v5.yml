name: Monthly Evaluation V5

on:
  pull_request:
    paths:
      - 'src/pages/StaffMonthlyEvaluationGeneral.tsx'
      - 'src/components/evaluations/**'
      - 'src/lib/evaluations/**'
      - 'src/lib/staff/employeeMonthlyEvidenceService.ts'
      - 'src/lib/staff/staffPointsDashboardService.ts'
      - 'supabase/migrations/*monthly_evaluation*.sql'
      - '.github/workflows/monthly-evaluation-v5.yml'
  push:
    branches:
      - 'feat/monthly-evaluation-command-center-v5-*'
    paths:
      - 'src/pages/StaffMonthlyEvaluationGeneral.tsx'
      - 'src/components/evaluations/**'
      - 'src/lib/evaluations/**'
      - 'src/lib/staff/employeeMonthlyEvidenceService.ts'
      - 'src/lib/staff/staffPointsDashboardService.ts'
      - 'supabase/migrations/*monthly_evaluation*.sql'
      - '.github/workflows/monthly-evaluation-v5.yml'

concurrency:
  group: monthly-evaluation-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
