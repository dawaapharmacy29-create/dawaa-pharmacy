name: Verify Customer Request Product Matching V7 Polish

on:
  push:
    branches:
      - agent/customer-request-product-matching-warehouse-export-v7

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
