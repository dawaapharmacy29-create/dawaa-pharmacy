name: Apply Customer Request Data Quality V3

on:
  push:
    branches:
      - agent/customer-request-data-quality-v3

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[customer-request-data-quality-v3-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: node scripts/apply-customer-request-data-quality-v3.cjs
      - run: npm run typecheck
      - run: npm run build
      - name: Commit applied data-quality UI
        run: |
          if git diff --quiet -- src/pages/CustomerRequests.tsx; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomerRequests.tsx
          git commit -m "إضافة مركز جودة وربط بيانات الطلب [customer-request-data-quality-v3-applied]"
          git push
