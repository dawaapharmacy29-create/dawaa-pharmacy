name: Apply customer request quick advance V10

on:
  push:
    branches:
      - agent/customer-request-quick-advance-v10

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[quick-advance-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-request-quick-advance-v10
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply quick advance transformation
        run: node scripts/apply-customer-request-quick-advance-v10.cjs
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomerRequests.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "إضافة انتقال سريع للمرحلة التالية من كارت الطلب [quick-advance-applied]"
          git push origin HEAD:agent/customer-request-quick-advance-v10
