name: Optimize heavy page reads

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Apply bounded read fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding='utf-8')
              if new and new in text:
                  print(f'{label}: already applied')
                  return
              if old not in text:
                  print(f'{label}: source block already absent')
                  return
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'{label}: applied')

          shift_notes = Path('src/pages/ShiftNotes.tsx')
          old_customer_preload = """  const { data: customerRows } = useSupabaseQuery<Record<string, unknown>>({
    table: 'customers',
    realtimeEnabled: false,
    limit: 5000,
  });
"""
          replace_once(shift_notes, old_customer_preload, '', 'shift-notes customer preload')

          customer360 = Path('src/pages/Customer360.tsx')
          old_reviews = """  const loadEvaluationHistory = useCallback(async () => {
    const identity = {
      code: displayCode,
      phone: displayPhone2,
      name: displayName,
    };
    if (!identity.code && !identity.phone && !identity.name) return;
    const result = await safeRows<Record<string, unknown>>(
      'conversation_sales_reviews',
      (query) => query.order('created_at', { ascending: false }),
      300
    );
    if (result.error) {
      setEvaluationWarning(`تعذر تحميل سجل تقييمات المحادثة: ${result.error}`);
      setEvaluationHistory([]);
      return;
    }
    setEvaluationWarning(null);
    setEvaluationHistory(
      result.rows
        .filter((row) => {
          const code = String(row.customer_code || '').trim();
          const phone = String(row.customer_phone || row.phone || '').trim();
          const name = String(row.customer_name || '').trim();
          return (
            (identity.code && code === identity.code) ||
            (identity.phone && phone === identity.phone) ||
            (identity.name && name === identity.name)
          );
        })
        .slice(0, 20)
    );
  }, [displayCode, displayName, displayPhone2]);
"""
          new_reviews = """  const loadEvaluationHistory = useCallback(async () => {
    const identity = {
      code: displayCode.trim(),
      phone: displayPhone2.trim(),
      name: displayName.trim(),
    };
    if (!identity.code && !identity.phone && !identity.name) return;

    const lookups = [];
    if (identity.code) {
      lookups.push(
        safeRows<Record<string, unknown>>(
          'conversation_sales_reviews',
          (query) => query.eq('customer_code', identity.code).order('created_at', { ascending: false }),
          20
        )
      );
    }
    if (identity.phone) {
      lookups.push(
        safeRows<Record<string, unknown>>(
          'conversation_sales_reviews',
          (query) => query.eq('customer_phone', identity.phone).order('created_at', { ascending: false }),
          20
        )
      );
    }
    if (identity.name) {
      lookups.push(
        safeRows<Record<string, unknown>>(
          'conversation_sales_reviews',
          (query) => query.eq('customer_name', identity.name).order('created_at', { ascending: false }),
          20
        )
      );
    }

    const results = await Promise.all(lookups);
    const availableResults = results.filter((result) => result.available);
    if (!availableResults.length) {
      const error = results.find((result) => result.error)?.error || 'المصدر غير متاح';
      setEvaluationWarning(`تعذر تحميل سجل تقييمات المحادثة: ${error}`);
      setEvaluationHistory([]);
      return;
    }

    const deduped = new Map<string, Record<string, unknown>>();
    for (const row of availableResults.flatMap((result) => result.rows)) {
      const key = String(
        row.id || `${row.created_at || ''}|${row.customer_code || ''}|${row.customer_phone || ''}|${row.customer_name || ''}`
      );
      if (!deduped.has(key)) deduped.set(key, row);
    }
    const rows = [...deduped.values()]
      .sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')))
      .slice(0, 20);

    setEvaluationWarning(null);
    setEvaluationHistory(rows);
  }, [displayCode, displayName, displayPhone2]);
"""
          replace_once(customer360, old_reviews, new_reviews, 'customer-360 targeted review history')
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit optimized reads
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- src/pages/ShiftNotes.tsx src/pages/Customer360.tsx; then
            echo 'No page changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ShiftNotes.tsx src/pages/Customer360.tsx
          git commit -m 'perf: bound shift notes and customer profile reads'
          git push origin "HEAD:${HEAD_BRANCH}"
