name: Generate SI Refresh API V8

on:
  push:
    branches:
      - fix/si-regenerate-v8-refresh-api-20261003
    paths:
      - '.github/workflows/generate-si-refresh-api-v8.yml'
      - 'server/sales-intelligence-refresh-source.ts'
      - 'src/lib/salesIntelligence/**'
      - 'src/lib/whatsappConversationUnderstandingV32.ts'
      - 'src/lib/whatsappSemanticSignalsV32.ts'
      - 'scripts/build-sales-intelligence-refresh-api.cjs'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/si-regenerate-v8-refresh-api-20261003
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Generate refresh API
        run: node scripts/build-sales-intelligence-refresh-api.cjs
      - name: Commit generated API if changed
        run: |
          if git diff --quiet -- api/sales-intelligence-refresh-source.js; then
            echo 'No generated API change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/sales-intelligence-refresh-source.js
          git commit -m 'chore(si): regenerate V8 refresh API'
          git push origin HEAD:fix/si-regenerate-v8-refresh-api-20261003
