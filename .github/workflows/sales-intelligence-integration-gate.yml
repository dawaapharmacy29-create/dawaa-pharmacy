name: Sales Intelligence Integration Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://jkjqeqkshllustwlzzbf.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Unit and integration test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify backend secret is available
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY repository secret."
            exit 1
          fi

      - name: Sales Intelligence all-known-branch dry run
        run: npm run sales-intelligence:backfill:all-known-branch:dry-run -- --json

      - name: Product Demand V22 canonical dry run
        run: npm run product-demand:v22:backfill:dry-run
