name: Temp SI Refresh API Generate

on:
  push:
    branches:
      - fix/si-case-lifecycle-reconciliation-20261003
    paths:
      - server/sales-intelligence-refresh-source.ts
      - src/lib/salesIntelligence/refresh/**
      - src/lib/salesIntelligence/conversationEvaluationPersistence.ts
      - scripts/build-sales-intelligence-refresh-api.cjs
      - .github/workflows/temp-si-refresh-api-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/si-case-lifecycle-reconciliation-20261003
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Generate canonical refresh API
        run: node scripts/build-sales-intelligence-refresh-api.cjs
      - name: Commit generated file if changed
        shell: bash
        run: |
          if git diff --quiet -- api/sales-intelligence-refresh-source.js; then
            echo "Generated API already matches source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/sales-intelligence-refresh-source.js
          git commit -m "chore(si): regenerate refresh API"
          git push origin HEAD:fix/si-case-lifecycle-reconciliation-20261003
