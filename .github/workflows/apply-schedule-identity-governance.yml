name: Apply schedule identity governance
on:
  push:
    branches: [feat/schedule-identity-governance]
    paths:
      - scripts/apply-schedule-identity-governance.cjs
      - .github/workflows/apply-schedule-identity-governance.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/schedule-identity-governance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-schedule-identity-governance.cjs
      - run: |
          if git diff --quiet -- src/pages/Schedule.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Schedule.tsx
          git commit -m "feat: expose schedule identity governance"
          git push origin HEAD:feat/schedule-identity-governance
