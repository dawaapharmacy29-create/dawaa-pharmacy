name: Apply Customer Request Quality Center V4

on:
  push:
    branches:
      - agent/customer-request-quality-center-v4

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[customer-request-quality-center-v4-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: node scripts/apply-customer-request-quality-center-v4.cjs
      - run: npm run typecheck
      - run: npm run build
      - name: Commit applied quality center
        run: |
          if git diff --quiet -- src/pages/CustomerRequests.tsx; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomerRequests.tsx
          git commit -m "ربط مركز مشاكل بيانات الطلبات [customer-request-quality-center-v4-applied]"
          git pull --rebase origin agent/customer-request-quality-center-v4
          git push origin HEAD:agent/customer-request-quality-center-v4
