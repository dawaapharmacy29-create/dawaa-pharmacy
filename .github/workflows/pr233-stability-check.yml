name: PR233 stability check

on:
  push:
    branches:
      - fix/performance-import-review-20260822
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
