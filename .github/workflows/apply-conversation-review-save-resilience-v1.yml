name: Apply conversation review save resilience v1

on:
  push:
    branches:
      - fix/conversation-review-save-rls
    paths:
      - scripts/patch-conversation-review-save-resilience-v1.cjs
      - .github/workflows/apply-conversation-review-save-resilience-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/conversation-review-save-rls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/patch-conversation-review-save-resilience-v1.cjs
      - name: Remove one-time helpers
        run: rm -f scripts/patch-conversation-review-save-resilience-v1.cjs .github/workflows/apply-conversation-review-save-resilience-v1.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Reviews.tsx scripts/patch-conversation-review-save-resilience-v1.cjs .github/workflows/apply-conversation-review-save-resilience-v1.yml
          git commit -m "fix(reviews): make save idempotent and fast" || exit 0
          git push origin HEAD:fix/conversation-review-save-rls
