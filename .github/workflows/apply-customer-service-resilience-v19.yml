name: Apply customer service resilience V19
on:
  push:
    branches: [agent/customer-service-resilience-v19]
    paths:
      - scripts/apply-customer-service-resilience-v19.cjs
      - .github/workflows/apply-customer-service-resilience-v19.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-service-resilience-v19
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-customer-service-resilience-v19.cjs
      - name: Commit generated source change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/customerService/CustomerDailyPriorityQueues.tsx
          git commit -m "fix: keep customer service queues available on partial timeout"
          git push
