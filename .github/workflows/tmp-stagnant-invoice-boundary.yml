name: Apply stagnant customer invoice boundary
on:
  push:
    branches:
      - arch/stagnant-customer-invoice-boundary-v1
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/stagnant-customer-invoice-boundary-v1
      - name: Apply migration
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/StagnantMedicines.tsx')
          text = page.read_text(encoding='utf-8-sig')

          old_import = "import { getCustomers } from '@/lib/api/customers';\nimport { phoneSearchTokens } from '@/lib/phone';"
          new_import = "import { getCustomers } from '@/lib/api/customers';\nimport { readCustomerInvoices } from '@/lib/readModels/customerInvoiceReadModel';\nimport { phoneSearchTokens } from '@/lib/phone';"
          if old_import not in text:
              raise SystemExit('Stagnant import anchor not found')
          text = text.replace(old_import, new_import, 1)

          invoice_query = """  const { data: invoiceCustomers } = useSupabaseQuery<CustomerOption>({\n    table: 'sales_invoices',\n    orderBy: { column: 'invoice_date', ascending: false },\n    limit: 10000,\n    realtimeEnabled: false,\n  });\n"""
          if invoice_query not in text:
              raise SystemExit('Stagnant invoice preload anchor not found')
          text = text.replace(invoice_query, '', 1)

          old_loop = "for (const customer of [...(invoiceCustomers || []), ...(customers || [])]) {"
          new_loop = "for (const customer of customers || []) {"
          if old_loop not in text:
              raise SystemExit('Stagnant customer options loop anchor not found')
          text = text.replace(old_loop, new_loop, 1)

          old_deps = "}, [customers, invoiceCustomers, user?.branch]);"
          new_deps = "}, [customers, user?.branch]);"
          if old_deps not in text:
              raise SystemExit('Stagnant customer options deps anchor not found')
          text = text.replace(old_deps, new_deps, 1)

          old_search = """        await searchTable('customers', term);\n        await searchTable('sales_invoices', term);"""
          new_search = """        await searchTable('customers', term);\n        const invoiceResult = await readCustomerInvoices({\n          customerCode: term,\n          customerPhone: term,\n          customerName: term,\n        });\n        results.push(...invoiceResult.rows.map(mapRecord));"""
          if old_search not in text:
              raise SystemExit('Stagnant invoice search anchor not found')
          text = text.replace(old_search, new_search, 1)
          page.write_text(text, encoding='utf-8')

          gate = Path('scripts/check-generic-query-data-access.cjs')
          gate_text = gate.read_text(encoding='utf-8')
          start = gate_text.index('const LEGACY_GENERIC_INVOICE_UI_READERS')
          end = gate_text.index(']);', start)
          block = gate_text[start:end]
          line = "  'src/pages/StagnantMedicines.tsx',\n"
          if line not in block:
              raise SystemExit('Stagnant invoice debt entry not found')
          block = block.replace(line, '', 1)
          delivery_line = "  'src/pages/Delivery.tsx',\n"
          if delivery_line in block and 'external delivery application' not in block:
              block = block.replace(
                  delivery_line,
                  "  // Intentional external-integration exception: operational delivery truth lives in the separate external delivery application.\n" + delivery_line,
                  1,
              )
          gate.write_text(gate_text[:start] + block + gate_text[end:], encoding='utf-8')

          Path('.github/workflows/tmp-stagnant-invoice-boundary.yml').unlink()
          PY
      - name: Commit migration
        run: |
          git config user.name "dawaa-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: route stagnant customer invoice lookup through boundary"
          git push origin HEAD:arch/stagnant-customer-invoice-boundary-v1
