name: Temporary Points employee read migration
on:
  push:
    branches: [arch/points-canonical-employee-read-v1]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/points-canonical-employee-read-v1
      - name: Apply targeted migration
        shell: python
        run: |
          from pathlib import Path

          page = Path('src/pages/Points.tsx')
          s = page.read_text(encoding='utf-8-sig')
          old_import = "import { useAuth, getCurrentUserProfile } from '@/hooks/useAuth';\nimport { logActivity, useSupabaseQuery } from '@/hooks/useSupabaseQuery';"
          new_import = "import { useAuth, getCurrentUserProfile } from '@/hooks/useAuth';\nimport { useEmployeeTransactions } from '@/hooks/useEmployeeTransactions';\nimport { logActivity, useSupabaseQuery } from '@/hooks/useSupabaseQuery';"
          if old_import not in s:
              raise SystemExit('Points import anchor not found')
          s = s.replace(old_import, new_import, 1)

          old_query = """  const {\n    data: records,\n    loading: recLoading,\n    refetch: refetchRecords,\n  } = useSupabaseQuery<PointRecord>({\n    table: TABLES.employeeTransactions,\n    orderBy: { column: 'created_at', ascending: false },\n    realtimeEnabled: true,\n  });"""
          new_query = """  const {\n    data: records,\n    loading: recLoading,\n    refetch: refetchRecords,\n  } = useEmployeeTransactions<PointRecord>({\n    startDate: cycle.startDate,\n    endDate: cycle.endDate,\n    realtimeEnabled: true,\n  });"""
          if old_query not in s:
              raise SystemExit('Points employee transaction query anchor not found')
          s = s.replace(old_query, new_query, 1)

          if 'TABLES.' not in s:
              s = s.replace("import { TABLES } from '@/lib/supabaseTables';\n", '', 1)
          page.write_text(s, encoding='utf-8')

          gate = Path('scripts/check-generic-query-data-access.cjs')
          g = gate.read_text(encoding='utf-8')
          debt = "  'src/pages/Points.tsx',\n"
          if debt not in g:
              raise SystemExit('Points employee transaction debt anchor not found')
          # Remove only the Points entry from the employee-transaction register, not the staff register.
          marker = 'const LEGACY_GENERIC_EMPLOYEE_TRANSACTION_UI_READERS = new Set(['
          start = g.index(marker)
          end = g.index(']);', start)
          block = g[start:end]
          if debt not in block:
              raise SystemExit('Points not present in employee transaction debt register')
          block = block.replace(debt, '', 1)
          g = g[:start] + block + g[end:]
          gate.write_text(g, encoding='utf-8')
      - name: Commit migration
        run: |
          rm .github/workflows/tmp-points-employee-read.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/Points.tsx scripts/check-generic-query-data-access.cjs .github/workflows/tmp-points-employee-read.yml
          git commit -m "refactor: use canonical employee ledger in Points"
          git push origin HEAD:arch/points-canonical-employee-read-v1
