name: Apply safe staff directory migrations
on:
  push:
    branches: [arch/staff-directory-safe-pages-v1]
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message == 'chore: migrate safe staff readers to directory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/staff-directory-safe-pages-v1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply migrations
        shell: python
        run: |
          from pathlib import Path

          stories = Path('src/pages/Stories.tsx')
          text = stories.read_text(encoding='utf-8')
          text = text.replace("import { isActiveStaffFilter } from '@/lib/staffActiveFilter';\n", "")
          text = text.replace("import { useSupabaseQuery } from '@/hooks/useSupabaseQuery';\n", "import { useStaffDirectory } from '@/hooks/useStaffDirectory';\n")
          old = """  const { data: staffRows } = useSupabaseQuery<StaffOption>({\n    table: 'staff',\n    filters: isActiveStaffFilter(),\n    realtimeEnabled: false,\n  });"""
          new = """  const { data: staffDirectory = [] } = useStaffDirectory();\n  const staffRows = useMemo(\n    () =>\n      staffDirectory\n        .filter((item) => item.source !== 'alias' && item.active)\n        .map((item) => ({\n          id: item.id || undefined,\n          name: item.name,\n          role: item.role,\n          branch: item.branch,\n        })),\n    [staffDirectory]\n  );"""
          if old not in text:
              raise SystemExit('Stories staff query anchor not found')
          text = text.replace(old, new, 1)
          stories.write_text(text, encoding='utf-8')

          incentive = Path('src/pages/IncentiveMedicines.tsx')
          text = incentive.read_text(encoding='utf-8')
          text = text.replace("import { isActiveStaffFilter } from '@/lib/staffActiveFilter';\n", "")
          anchor = "import { readStaffDirectory } from '@/lib/readModels/staffDirectoryReadModel';\n"
          if anchor not in text:
              raise SystemExit('Incentive staff directory import anchor not found')
          text = text.replace(anchor, anchor + "import { useStaffDirectory } from '@/hooks/useStaffDirectory';\n", 1)
          old = """  const { data: staffOptions } = useSupabaseQuery<DoctorOption>({\n    table: 'staff',\n    filters: isActiveStaffFilter(),\n    orderBy: { column: 'name', ascending: true },\n    realtimeEnabled: false,\n  });"""
          new = """  const { data: staffDirectory = [] } = useStaffDirectory();\n  const staffOptions = useMemo<DoctorOption[]>(\n    () =>\n      staffDirectory\n        .filter((item) => item.source !== 'alias' && item.active && item.id && item.name)\n        .map((item) => ({\n          id: item.id as string,\n          name: item.name as string,\n          role: item.role,\n          branch: item.branch,\n          branch_name: item.branch,\n          active: item.active,\n        })),\n    [staffDirectory]\n  );"""
          if old not in text:
              raise SystemExit('Incentive staff query anchor not found')
          text = text.replace(old, new, 1)
          incentive.write_text(text, encoding='utf-8')

          gate = Path('scripts/check-generic-query-data-access.cjs')
          text = gate.read_text(encoding='utf-8')
          for line in ["  'src/pages/IncentiveMedicines.tsx',\n", "  'src/pages/Stories.tsx',\n"]:
              if line not in text:
                  raise SystemExit(f'Gate debt line not found: {line.strip()}')
              text = text.replace(line, '', 1)
          gate.write_text(text, encoding='utf-8')

          Path('.github/workflows/tmp-staff-directory-safe-pages.yml').unlink()
      - name: Commit migrations
        run: |
          git config user.name "dawaa-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/Stories.tsx src/pages/IncentiveMedicines.tsx scripts/check-generic-query-data-access.cjs .github/workflows/tmp-staff-directory-safe-pages.yml
          git commit -m "refactor: use canonical staff directory in safe pages"
          git push origin HEAD:arch/staff-directory-safe-pages-v1
