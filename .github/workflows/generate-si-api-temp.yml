name: Generate SI API Temp

on:
  push:
    branches:
      - fix/si-quality-closing-continuation-20261004

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Generate canonical Sales Intelligence API
        run: node scripts/build-sales-intelligence-refresh-api.cjs
      - name: Verify generated API is current
        run: node scripts/build-sales-intelligence-refresh-api.cjs --check
      - name: Verify semantic versions are embedded
        run: |
          grep -q "sales-intelligence-v13" api/sales-intelligence-refresh-source.js
          grep -q "case-segmentation-v9" api/sales-intelligence-refresh-source.js
          grep -q "commercial-confirmation-v5" api/sales-intelligence-refresh-source.js
      - uses: actions/upload-artifact@v4
        with:
          name: sales-intelligence-refresh-api-generated
          path: api/sales-intelligence-refresh-source.js
          retention-days: 1
