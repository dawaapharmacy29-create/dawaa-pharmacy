name: Temporary penalty canonical read migration

on:
  push:
    branches:
      - arch/penalty-incentive-employee-read-v2

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/penalty-incentive-employee-read-v2
          fetch-depth: 0
      - name: Apply targeted migration
        shell: python
        run: |
          from pathlib import Path

          page = Path('src/pages/PenaltyIncentiveManagement.tsx')
          text = page.read_text(encoding='utf-8')

          text = text.replace(
              "import { useSupabaseQuery } from '@/hooks/useSupabaseQuery';\n",
              "import { useEmployeeTransactions } from '@/hooks/useEmployeeTransactions';\n",
              1,
          )
          text = text.replace("import { supabase } from '@/lib/supabase';\n", "", 1)
          text = text.replace("import { TABLES } from '@/lib/supabaseTables';\n", "", 1)

          old = """  const {\n    data: records,\n    loading: recLoading,\n    refetch: refetchRecords,\n  } = useSupabaseQuery<PointRecord>({\n    table: TABLES.employeeTransactions,\n    orderBy: { column: 'created_at', ascending: false },\n    limit: 100,\n    realtimeEnabled: true,\n  });"""
          new = """  const {\n    data: records,\n    loading: recLoading,\n    refetch: refetchRecords,\n  } = useEmployeeTransactions<PointRecord>({\n    limit: 100,\n    realtimeEnabled: true,\n  });"""
          if old not in text:
              raise SystemExit('Expected PenaltyIncentiveManagement transaction reader not found')
          text = text.replace(old, new, 1)
          page.write_text(text, encoding='utf-8')

          gate = Path('scripts/check-generic-query-data-access.cjs')
          gate_text = gate.read_text(encoding='utf-8')
          debt = "  'src/pages/PenaltyIncentiveManagement.tsx',\n"
          if debt not in gate_text:
              raise SystemExit('Expected penalty debt entry not found')
          gate.write_text(gate_text.replace(debt, '', 1), encoding='utf-8')

          Path('.github/workflows/tmp-penalty-canonical-read.yml').unlink()
      - name: Commit migration
        run: |
          git config user.name "dawaa-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/PenaltyIncentiveManagement.tsx scripts/check-generic-query-data-access.cjs .github/workflows/tmp-penalty-canonical-read.yml
          git commit -m "refactor: use canonical employee transaction reads for penalties"
          git push origin HEAD:arch/penalty-incentive-employee-read-v2
