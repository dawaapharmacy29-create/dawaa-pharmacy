name: Fix customer service Excel dashboard V20

on:
  push:
    branches:
      - agent/customer-service-excel-dashboard-v20

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[excel-dashboard-v20-lint-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-service-excel-dashboard-v20
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-customer-service-excel-dashboard-v20.cjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/customerService/customerServiceExcelWorkbook.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "إصلاح lint Dashboard Excel [excel-dashboard-v20-lint-fixed]"
          git push origin HEAD:agent/customer-service-excel-dashboard-v20
