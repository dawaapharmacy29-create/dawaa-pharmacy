name: Apply conversation review filters

on:
  push:
    branches:
      - agent/reviews-branch-doctor-date-filters

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/reviews-branch-doctor-date-filters
          fetch-depth: 0

      - name: Apply focused patch
        run: node scripts/apply-reviews-history-filters.cjs

      - name: Validate changed page
        run: |
          npm ci
          npm run build

      - name: Commit generated page change
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Reviews.tsx
          git commit -m "add branch doctor and date filters to conversation reviews"
          git push
