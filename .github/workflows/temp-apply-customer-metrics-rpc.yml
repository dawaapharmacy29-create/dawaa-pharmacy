name: Temporary apply customer metrics RPC patch

on:
  push:
    paths:
      - '.github/workflows/temp-apply-customer-metrics-rpc.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact customer metrics patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const apiPath = 'src/lib/api/customers.ts';
          let source = fs.readFileSync(apiPath, 'utf8');
          const importAnchor = "import type { CustomerMetric as CustomerMetricType, CustomerLike } from '@/types/domain';";
          const helperImport = `import {\n  fetchCustomerInvoiceMetricsPatch,\n  type CustomerInvoiceMetricPatchRow,\n} from '@/lib/api/customerInvoiceMetricsPatch';\n\n`;
          if (!source.includes("from '@/lib/api/customerInvoiceMetricsPatch'")) {
            if (!source.includes(importAnchor)) throw new Error('customer import anchor missing');
            source = source.replace(importAnchor, helperImport + importAnchor);
          }

          const startMarker = 'async function patchCustomerMetricsFromInvoices(customers: CustomerMetric[]) {';
          const endMarker = '\nfunction applyBranchFilter';
          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end < 0 || end <= start) throw new Error('customer patch markers missing');

          const replacement = `async function patchCustomerMetricsFromInvoices(customers: CustomerMetric[]) {
  const codes = [
    ...new Set(
      customers.map((customer) => String(customer.customer_code || '').trim()).filter(Boolean)
    ),
  ];
  if (!codes.length) return customers;

  const rows = await fetchCustomerInvoiceMetricsPatch(codes);
  if (!rows?.length) return customers;

  const aggregates = new Map<string, CustomerInvoiceMetricPatchRow>();
  for (const row of rows) {
    const code = String(row.customer_code || '').trim();
    if (code) aggregates.set(code, row);
  }

  return customers.map((customer) => {
    const aggregate = aggregates.get(String(customer.customer_code || '').trim());
    if (!aggregate) return customer;
    const aggregateCount = toNumber(aggregate.invoices_count);
    const aggregateTotal = toNumber(aggregate.total_spent);
    const aggregateMonths = toNumber(aggregate.active_months);
    const invoicesCount = Math.max(customer.invoices_count || 0, aggregateCount);
    const totalSpent = Math.max(customer.total_spent || 0, aggregateTotal);
    const patched: CustomerMetric = {
      ...customer,
      invoices_count: invoicesCount,
      total_spent: totalSpent,
      total_purchases: totalSpent,
      avg_invoice:
        invoicesCount > 0
          ? Math.max(customer.avg_invoice || 0, totalSpent / invoicesCount)
          : customer.avg_invoice,
      first_purchase: isBeforeDate(aggregate.first_purchase, customer.first_purchase)
        ? aggregate.first_purchase || null
        : customer.first_purchase,
      last_purchase: isAfterDate(aggregate.last_purchase, customer.last_purchase)
        ? aggregate.last_purchase || null
        : customer.last_purchase,
      active_months: Math.max(customer.active_months || 0, aggregateMonths),
    };
    return normalizeMetricAfterInvoicePatch(patched);
  });
}
`;
          source = source.slice(0, start) + replacement + source.slice(end);
          fs.writeFileSync(apiPath, source);

          const gatePath = 'scripts/check-data-access-boundaries.cjs';
          let gate = fs.readFileSync(gatePath, 'utf8');
          const oldBudget = "['src/lib/api/customers.ts', 4]";
          const newBudget = "['src/lib/api/customers.ts', 3]";
          if (!gate.includes(oldBudget) && !gate.includes(newBudget)) throw new Error('customer debt budget anchor missing');
          gate = gate.replace(oldBudget, newBudget);
          fs.writeFileSync(gatePath, gate);
          NODE

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Validate architecture and TypeScript
        run: |
          node scripts/check-data-access-boundaries.cjs
          npm run typecheck

      - name: Commit patch to current branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/customers.ts scripts/check-data-access-boundaries.cjs
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "perf: route customer list invoice metrics through aggregate RPC"
          git push origin HEAD:${GITHUB_REF_NAME}
