name: Apply Staff HR360 tab v1

on:
  push:
    branches:
      - feat/hr-compliance-center-v1
    paths:
      - scripts/patch-staff-hr360-tab-v1.cjs
      - .github/workflows/apply-staff-hr360-tab-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hr-compliance-center-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply HR360 tab patch
        run: node scripts/patch-staff-hr360-tab-v1.cjs
      - name: Remove one-time helpers
        run: rm -f scripts/patch-staff-hr360-tab-v1.cjs .github/workflows/apply-staff-hr360-tab-v1.yml
      - name: Commit HR360 tab wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/StaffProfile2027.tsx scripts/patch-staff-hr360-tab-v1.cjs .github/workflows/apply-staff-hr360-tab-v1.yml
          git commit -m "feat(hr): wire staff HR 360 tab" || exit 0
          git push origin HEAD:feat/hr-compliance-center-v1
