name: TEMP Generate Sales Intelligence API

on:
  push:
    branches:
      - si-conversation-eval-test-20260930

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: si-conversation-eval-test-20260930
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Generate canonical API bundle
        run: node scripts/build-sales-intelligence-refresh-api.cjs
      - name: Commit generated API if changed
        shell: bash
        run: |
          if git diff --quiet -- api/sales-intelligence-refresh-source.js; then
            echo "Generated API already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/sales-intelligence-refresh-source.js
          git commit -m "chore(test): regenerate sales intelligence refresh api"
          git push origin HEAD:si-conversation-eval-test-20260930
