name: Apply notification review deeplink patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch review notification deep link
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Force conversation-review notifications to the canonical review history deep link.
          p = Path('src/hooks/useNotifications.ts')
          s = p.read_text()
          old = """export function notificationRoute(notification: AppNotification) {\n  const explicit = String(\n    notification.route || notification.target_route || notification.metadata?.route || ''\n  ).trim();\n  const id =\n    notification.target_id ||\n    String(\n      notification.metadata?.entity_id ||\n        notification.metadata?.review_id ||\n        notification.metadata?.id ||\n        ''\n    );\n\n  return canonicalNotificationRoute({\n    type: notification.type || notification.target_type,\n    entityId: id,\n    explicitRoute: explicit,\n    recipientStaffId: notification.recipient_staff_id || undefined,\n  });\n}\n"""
          new = """export function notificationRoute(notification: AppNotification) {\n  const type = canonicalNotificationType(notification.type || notification.target_type);\n  const explicit = String(\n    notification.route || notification.target_route || notification.metadata?.route || ''\n  ).trim();\n  const id =\n    notification.target_id ||\n    String(\n      notification.metadata?.entity_id ||\n        notification.metadata?.review_id ||\n        notification.metadata?.source_review_id ||\n        notification.metadata?.id ||\n        ''\n    );\n\n  // Conversation-review notifications must always open the exact saved review.\n  // Older rows can carry a legacy doctor-dashboard route, so do not let that stale\n  // explicit route override the canonical details deep link.\n  const explicitRoute = type === 'conversation_review' ? '' : explicit;\n\n  return canonicalNotificationRoute({\n    type,\n    entityId: id,\n    explicitRoute,\n    recipientStaffId: notification.recipient_staff_id || undefined,\n  });\n}\n"""
          if old not in s:
              raise SystemExit('useNotifications notificationRoute block not found')
          p.write_text(s.replace(old, new))

          # Add canonicalNotificationType import.
          p = Path('src/hooks/useNotifications.ts')
          s = p.read_text()
          old = """import {\n  canonicalNotificationRoute,\n  notificationPreferenceCategory,\n} from '@/lib/notifications/notificationDomain';\n"""
          new = """import {\n  canonicalNotificationRoute,\n  canonicalNotificationType,\n  notificationPreferenceCategory,\n} from '@/lib/notifications/notificationDomain';\n"""
          if old not in s:
              raise SystemExit('notificationDomain import block not found')
          p.write_text(s.replace(old, new))

          # 2) Canonical route for review notifications points at Reviews history + exact id.
          p = Path('src/lib/notifications/notificationDomain.ts')
          s = p.read_text()
          old = "conversation_review: id ? `/doctor-dashboard?tab=reviews&review=${id}` : '/doctor-dashboard?tab=reviews',"
          new = "conversation_review: id ? `/reviews?section=history&id=${id}` : '/reviews?section=history',"
          if old not in s:
              raise SystemExit('conversation_review canonical route not found')
          p.write_text(s.replace(old, new))

          # 3) Reviews page consumes ?id= and opens the full details modal directly.
          p = Path('src/pages/Reviews.tsx')
          s = p.read_text()
          anchor = """  const openReviewDetails = useCallback((row: ConversationReviewHistoryRow) => {\n    setSelectedReview(row);\n    setSelectedReviewId(row.id || null);\n  }, []);\n\n"""
          addition = """  const openReviewDetails = useCallback((row: ConversationReviewHistoryRow) => {\n    setSelectedReview(row);\n    setSelectedReviewId(row.id || null);\n  }, []);\n\n  // Deep-link support for notifications: /reviews?section=history&id=<review-id>\n  // Fetch the row directly instead of waiting for/paging through the history list.\n  useEffect(() => {\n    const reviewId = String(searchParams.get('id') || '').trim();\n    if (!reviewId || selectedReviewId === reviewId) return;\n\n    let cancelled = false;\n    setHistoryLoading(true);\n    setHistoryError(null);\n    supabase\n      .from('conversation_sales_reviews')\n      .select('*')\n      .eq('id', reviewId)\n      .maybeSingle()\n      .then(({ data, error }) => {\n        if (cancelled) return;\n        setHistoryLoading(false);\n        if (error) {\n          setHistoryError('تعذر تحميل تفاصيل تقييم المحادثة من الإشعار.');\n          return;\n        }\n        if (!data) {\n          setHistoryError('لم يتم العثور على تقييم المحادثة المرتبط بهذا الإشعار.');\n          return;\n        }\n        setSelectedReview(data as ConversationReviewHistoryRow);\n        setSelectedReviewId(reviewId);\n      })\n      .catch(() => {\n        if (cancelled) return;\n        setHistoryLoading(false);\n        setHistoryError('تعذر تحميل تفاصيل تقييم المحادثة من الإشعار.');\n      });\n\n    return () => {\n      cancelled = true;\n    };\n  }, [searchParams, selectedReviewId]);\n\n"""
          if anchor not in s:
              raise SystemExit('Reviews openReviewDetails anchor not found')
          p.write_text(s.replace(anchor, addition))
          PY
      - name: Remove one-off workflow
        run: rm -f .github/workflows/apply-notification-review-deeplink.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useNotifications.ts src/lib/notifications/notificationDomain.ts src/pages/Reviews.tsx .github/workflows/apply-notification-review-deeplink.yml
          git commit -m "fix: open conversation review details from notifications"
          git push origin HEAD:fix/notification-review-details
