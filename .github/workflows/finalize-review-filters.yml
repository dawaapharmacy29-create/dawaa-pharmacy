name: Finalize conversation review filters

on:
  push:
    branches:
      - agent/reviews-branch-doctor-date-filters

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/reviews-branch-doctor-date-filters
          fetch-depth: 0

      - name: Apply permanent source changes
        run: |
          node scripts/apply-reviews-history-filters.cjs
          node <<'NODE'
          const fs = require('fs');
          const staffPath = 'src/pages/StaffMonthlyEvaluation.tsx';
          let staff = fs.readFileSync(staffPath, 'utf8');
          staff = staff.replace('user?.staff_id', 'user?.staffId');
          fs.writeFileSync(staffPath, staff);

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts.prebuild = pkg.scripts.prebuild.replace('node scripts/apply-reviews-history-filters.cjs && ', '');
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          rm scripts/apply-reviews-history-filters.cjs

      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Reviews.tsx src/pages/StaffMonthlyEvaluation.tsx package.json scripts/apply-reviews-history-filters.cjs
          git commit -m "finalize conversation review filters and fix typecheck"
          git push
