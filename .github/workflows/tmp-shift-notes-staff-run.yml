name: Execute shift notes staff migration
on:
  push:
    branches: [arch/shift-notes-staff-directory-v1]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/shift-notes-staff-directory-v1
      - run: python .github/scripts/tmp_migrate_shift_notes_staff.py
      - run: |
          git config user.name dawaa-architecture-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "refactor: use staff directory in shift notes"
          git push
