name: One-time dashboard quality patch v33

on:
  push:
    branches:
      - agent/dashboard-quality-truth-v33

permissions:
  contents: write

jobs:
  patch-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dashboard-quality-truth-v33
          fetch-depth: 0

      - name: Apply exact dashboard truth fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/ExecutiveDashboard2027.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "    'فرع الشامي': 1000000,\n    'فرع شكري': 1500000,",
                  "    'فرع الشامي': 1200000,\n    'فرع شكري': 1550000,",
                  'target defaults',
              ),
              (
                  """  const funnelData = [
    { name: 'المتابعات المفتوحة', value: Math.max(n(service.open_followups), 1), fill: '#2dd4bf' },
    {
      name: 'قيد المعالجة',
      value: Math.max(Math.round(n(service.open_followups) * 0.68), 1),
      fill: '#38bdf8',
    },
    { name: 'تحتاج مدير', value: Math.max(n(service.needs_manager), 1), fill: '#8b5cf6' },
    { name: 'مكتملة اليوم', value: Math.max(n(service.completed_today), 1), fill: '#22c55e' },
  ];""",
                  """  const funnelData = [
    { name: 'المتابعات المفتوحة', value: Math.max(n(service.open_followups), 0), fill: '#2dd4bf' },
    { name: 'المتابعات المتأخرة', value: Math.max(n(service.overdue_followups), 0), fill: '#ef4444' },
    { name: 'تحتاج مدير', value: Math.max(n(service.needs_manager), 0), fill: '#8b5cf6' },
    { name: 'مكتملة خلال الفترة', value: Math.max(n(service.completed_today), 0), fill: '#22c55e' },
  ];""",
                  'customer service funnel',
              ),
              (
                  """      const finalLoadedAt = new Date().toISOString();
      setState((prev) => ({ ...prev, loadedAt: finalLoadedAt }));
      try {
        saveDashboardCache(
          { ...state, loadedAt: finalLoadedAt },
          scopedBranch || ALL_BRANCHES,
          { start: startDate, end: endDate },
          user?.role
        );
      } catch (e) {
        // ignore cache save errors
      }""",
                  """      const finalLoadedAt = new Date().toISOString();
      setState((prev) => {
        const nextState = { ...prev, loadedAt: finalLoadedAt };
        try {
          saveDashboardCache(
            nextState,
            scopedBranch || ALL_BRANCHES,
            { start: startDate, end: endDate },
            user?.role
          );
        } catch (e) {
          // ignore cache save errors
        }
        return nextState;
      });""",
                  'fresh dashboard cache snapshot',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label} block, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify forbidden dashboard placeholders are gone
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F "'فرع الشامي': 1000000" src/pages/ExecutiveDashboard2027.tsx
          ! grep -F "'فرع شكري': 1500000" src/pages/ExecutiveDashboard2027.tsx
          ! grep -F "Math.round(n(service.open_followups) * 0.68)" src/pages/ExecutiveDashboard2027.tsx
          grep -F "'فرع الشامي': 1200000" src/pages/ExecutiveDashboard2027.tsx
          grep -F "'فرع شكري': 1550000" src/pages/ExecutiveDashboard2027.tsx
          grep -F "المتابعات المتأخرة" src/pages/ExecutiveDashboard2027.tsx

      - name: Commit dashboard patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ExecutiveDashboard2027.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: use real dashboard targets funnel and fresh cache"
          git push origin HEAD:agent/dashboard-quality-truth-v33
