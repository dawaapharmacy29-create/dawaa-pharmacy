name: Temp SI V17 Compact Total

on:
  push:
    branches:
      - fix/si-quality-closing-continuation-20261004
    paths:
      - .github/workflows/temp-si-v17-compact-total.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/si-quality-closing-continuation-20261004
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Apply V17 compact-total repair
        run: python3 scripts/tmp_si_v17_compact_total.py

      - name: Run Mohamed regression suite
        run: npx vitest run src/lib/__tests__/whatsappCustomerCaseEngineV22.test.ts

      - name: Run full tests
        run: node scripts/run-tests.cjs

      - name: TypeScript gate
        run: npx tsc --noEmit

      - name: Regenerate Sales Intelligence API
        run: node scripts/build-sales-intelligence-refresh-api.cjs

      - name: Verify generated API carries V17 truth
        run: |
          grep -q "sales-intelligence-v17" api/sales-intelligence-refresh-source.js
          grep -q "commercial-confirmation-v6-compact-total-interstitial-ack-safe" api/sales-intelligence-refresh-source.js
          grep -q "SAFE_WAITING_ACK_RX" api/sales-intelligence-refresh-source.js

      - name: Production build
        run: npm run build

      - name: Commit verified result and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/tmp_si_v17_compact_total.py .github/workflows/temp-si-v17-compact-total.yml
          git add -A
          git commit -m "fix: preserve compact total through short acknowledgements"
          git push origin HEAD:fix/si-quality-closing-continuation-20261004
