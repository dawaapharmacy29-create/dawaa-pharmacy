name: Apply data health queue labels

on:
  push:
    paths:
      - '.github/workflows/apply-data-health-queue-labels.yml'

permissions:
  contents: write

jobs:
  patch-data-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Apply data health labels patch
        run: python3 scripts/apply-data-health-queue-labels.py

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        run: npm run build

      - name: Commit data health labels
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/dataHealth/appDataHealthService.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: distinguish data errors from operational approval queues"
          git push origin HEAD:main
