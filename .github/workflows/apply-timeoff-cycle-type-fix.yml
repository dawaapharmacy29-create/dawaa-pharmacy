name: Apply time-off cycle type fix
on:
  push:
    branches: [feat/canonical-timeoff-attendance-foundation]
    paths:
      - scripts/fix-timeoff-cycle-types.cjs
      - .github/workflows/apply-timeoff-cycle-type-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-timeoff-attendance-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fix-timeoff-cycle-types.cjs
      - run: |
          if git diff --quiet -- src/pages/TimeOff.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/TimeOff.tsx
          git commit -m "fix: normalize pharmacy cycle dates for time-off RPC"
          git push origin HEAD:feat/canonical-timeoff-attendance-foundation
