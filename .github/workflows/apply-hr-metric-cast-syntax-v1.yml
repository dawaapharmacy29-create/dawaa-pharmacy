name: Apply HR metric cast syntax v1

on:
  push:
    branches:
      - feat/hr-compliance-center-v1
    paths:
      - scripts/patch-hr-metric-cast-syntax-v1.cjs
      - .github/workflows/apply-hr-metric-cast-syntax-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hr-compliance-center-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply syntax repair
        run: node scripts/patch-hr-metric-cast-syntax-v1.cjs
      - name: Remove one-time helpers
        run: rm -f scripts/patch-hr-metric-cast-syntax-v1.cjs .github/workflows/apply-hr-metric-cast-syntax-v1.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/HRComplianceCenter.tsx scripts/patch-hr-metric-cast-syntax-v1.cjs .github/workflows/apply-hr-metric-cast-syntax-v1.yml
          git commit -m "fix(hr): repair compliance metric cast syntax" || exit 0
          git push origin HEAD:feat/hr-compliance-center-v1
