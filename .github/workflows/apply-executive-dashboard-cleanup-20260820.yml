name: Apply executive dashboard cleanup 20260820

on:
  push:
    branches:
      - feature/executive-dashboard-cleanup-20260820
    paths:
      - scripts/apply_executive_dashboard_cleanup_20260820.py
      - .github/workflows/apply-executive-dashboard-cleanup-20260820.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/executive-dashboard-cleanup-20260820
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply verified transformations
        run: python scripts/apply_executive_dashboard_cleanup_20260820.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Remove temporary transformer
        run: |
          rm scripts/apply_executive_dashboard_cleanup_20260820.py
          rm .github/workflows/apply-executive-dashboard-cleanup-20260820.yml

      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor(dashboard): simplify executive command center and fix monthly truth"
          git push origin HEAD:feature/executive-dashboard-cleanup-20260820
