name: Execute staff directory migration
on:
  push:
    branches: [arch/staff-directory-safe-pages-v1]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/staff-directory-safe-pages-v1
      - run: python .github/scripts/tmp_migrate_safe_staff.py
      - run: |
          git config user.name dawaa-architecture-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "refactor: use canonical staff directory in safe pages"
          git push
