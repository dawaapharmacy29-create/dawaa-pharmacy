name: Apply customer request create modal V9

on:
  push:
    branches:
      - agent/customer-request-create-modal-v9

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[modal-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-request-create-modal-v9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply modal transformation
        run: node scripts/apply-customer-request-create-modal-v9.cjs
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomerRequests.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "تطوير نافذة تسجيل طلب عميل جديد [modal-applied]"
          git push origin HEAD:agent/customer-request-create-modal-v9
