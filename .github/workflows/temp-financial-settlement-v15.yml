name: Temp Financial Settlement V15

on:
  push:
    paths:
      - 'scripts/temp_apply_financial_settlement_v15.py'
      - '.github/workflows/temp-financial-settlement-v15.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/si-quality-closing-continuation-20261004
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply deterministic patch
        run: python3 scripts/temp_apply_financial_settlement_v15.py

      - name: Align ambiguity regression with the real segmentation entrypoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/__tests__/salesIntelligenceFinancialSettlement.test.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "import { buildConversationUnderstandingV32 } from '@/lib/whatsappConversationUnderstandingV32';\nimport { deriveConversationCases } from '@/lib/salesIntelligence/conversationCaseEngine';",
              "import { deriveSegmentedCases } from '@/lib/salesIntelligence/salesIntelligencePipeline';"
          )
          old = """  it('does not treat payment-continuation messages as multiple independent customer requests', () => {
    const messages = parseWhatsAppExport(RAW);
    const understanding = buildConversationUnderstandingV32(messages as any);
    const cases = deriveConversationCases({
      understanding,
      conversationId: 'ibrahim',
      customerIdHint: 'a2fd0b6e-1562-438c-8f16-76a43539f792',
      customerPhoneHint: '01016891940',
    });
    expect(cases).toHaveLength(1);
    expect(cases[0].humanReviewReasons).not.toContain('possible_unsegmented_multiple_requests');
  });
"""
          new = """  it('does not treat payment-continuation messages as multiple independent customer requests', () => {
    const segmented = deriveSegmentedCases({
      conversationId: 'ibrahim',
      rawWhatsAppExportText: RAW,
      trustedConversationStartedAt: '2026-09-27T18:03:34.000Z',
      customerIdHint: 'a2fd0b6e-1562-438c-8f16-76a43539f792',
      customerPhoneHint: '01016891940',
    });
    expect(segmented.cases).toHaveLength(1);
    expect(segmented.cases[0].conversationCase.humanReviewReasons).not.toContain('possible_unsegmented_multiple_requests');
  });
"""
          if old not in text:
              raise SystemExit('financial settlement ambiguity test block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run focused configured regression suite
        run: node scripts/run-tests.cjs

      - name: TypeScript gate
        run: npx tsc --noEmit

      - name: Regenerate canonical Sales Intelligence API
        run: node scripts/build-sales-intelligence-refresh-api.cjs

      - name: Verify generated API is canonical
        run: node scripts/build-sales-intelligence-refresh-api.cjs --check

      - name: Verify V15 markers
        run: |
          grep -q 'sales-intelligence-v15' api/sales-intelligence-refresh-source.js
          grep -q 'case-segmentation-v10-payment-continuation-ambiguity-safe' api/sales-intelligence-refresh-source.js
          grep -q 'financial_settlement' api/sales-intelligence-refresh-source.js

      - name: Commit verified result and remove temporary runner
        run: |
          rm -f scripts/temp_apply_financial_settlement_v15.py
          rm -f .github/workflows/temp-financial-settlement-v15.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add invoice-backed financial settlement V15'
          git push origin HEAD:fix/si-quality-closing-continuation-20261004
