name: Apply doctor sales truth V23
on:
  push:
    branches: [agent/doctor-sales-truth-v23]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/doctor-sales-truth-v23 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/apply-doctor-sales-truth-v23.cjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/doctorCompetitionMetrics.ts src/lib/staffInvoiceTruthService.ts src/lib/staff/sharedStaffSalesService.ts
          git commit -m "fix: align doctor sales with cleaned invoice truth" || exit 0
          git push
