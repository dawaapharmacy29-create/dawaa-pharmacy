name: Apply final performance audit patches

on:
  push:
    paths:
      - '.github/workflows/apply-final-performance-audit.yml'

permissions:
  contents: write

jobs:
  apply-performance-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Apply performance patch script
        run: python3 scripts/apply-final-performance-audit.py

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        run: npm run build

      - name: Commit optimized page loading
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Customers.tsx src/lib/api/customers.ts src/pages/Invoices.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "perf: optimize customer and invoice page loading"
          git push origin HEAD:main
