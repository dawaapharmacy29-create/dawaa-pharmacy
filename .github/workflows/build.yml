name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - name: Apply bounded page reads for PR 237
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 237
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          shift_notes = Path('src/pages/ShiftNotes.tsx')
          text = shift_notes.read_text(encoding='utf-8')
          old = """  const { data: customerRows } = useSupabaseQuery<Record<string, unknown>>({
    table: 'customers',
    realtimeEnabled: false,
    limit: 5000,
  });
"""
          if old in text:
              shift_notes.write_text(text.replace(old, '', 1), encoding='utf-8')
              print('Removed unused 5,000-customer ShiftNotes preload')
          else:
              print('ShiftNotes preload already removed')

          customer360 = Path('src/pages/Customer360.tsx')
          text = customer360.read_text(encoding='utf-8')
          old = """  const loadEvaluationHistory = useCallback(async () => {
    const identity = {
      code: displayCode,
      phone: displayPhone2,
      name: displayName,
    };
    if (!identity.code && !identity.phone && !identity.name) return;
    const result = await safeRows<Record<string, unknown>>(
      'conversation_sales_reviews',
      (query) => query.order('created_at', { ascending: false }),
      300
    );
    if (result.error) {
      setEvaluationWarning(`تعذر تحميل سجل تقييمات المحادثة: ${result.error}`);
      setEvaluationHistory([]);
      return;
    }
    setEvaluationWarning(null);
    setEvaluationHistory(
      result.rows
        .filter((row) => {
          const code = String(row.customer_code || '').trim();
          const phone = String(row.customer_phone || row.phone || '').trim();
          const name = String(row.customer_name || '').trim();
          return (
            (identity.code && code === identity.code) ||
            (identity.phone && phone === identity.phone) ||
            (identity.name && name === identity.name)
          );
        })
        .slice(0, 20)
    );
  }, [displayCode, displayName, displayPhone2]);
"""
          new = """  const loadEvaluationHistory = useCallback(async () => {
    const identity = {
      code: displayCode.trim(),
      phone: displayPhone2.trim(),
      name: displayName.trim(),
    };
    if (!identity.code && !identity.phone && !identity.name) return;

    const collected: Record<string, unknown>[] = [];
    let lastError: string | null = null;
    let availableSource = false;
    const queries: Array<{ column: string; value: string }> = [
      { column: 'customer_code', value: identity.code },
      { column: 'customer_phone', value: identity.phone },
      { column: 'customer_name', value: identity.name },
    ].filter((item) => Boolean(item.value));

    for (const item of queries) {
      const result = await safeRows<Record<string, unknown>>(
        'conversation_sales_reviews',
        (query) => query.eq(item.column, item.value).order('created_at', { ascending: false }),
        20
      );
      if (result.available) {
        availableSource = true;
        collected.push(...result.rows);
      } else if (result.error) {
        lastError = result.error;
      }
    }

    if (!availableSource) {
      setEvaluationWarning(`تعذر تحميل سجل تقييمات المحادثة: ${lastError || 'المصدر غير متاح'}`);
      setEvaluationHistory([]);
      return;
    }

    const deduped = new Map<string, Record<string, unknown>>();
    for (const row of collected) {
      const key = String(
        row.id || `${row.created_at || ''}|${row.customer_code || ''}|${row.customer_phone || ''}|${row.customer_name || ''}`
      );
      if (!deduped.has(key)) deduped.set(key, row);
    }

    setEvaluationWarning(null);
    setEvaluationHistory(
      [...deduped.values()]
        .sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')))
        .slice(0, 20)
    );
  }, [displayCode, displayName, displayPhone2]);
"""
          if old in text:
              customer360.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Targeted Customer360 review history by customer identity')
          elif new in text:
              print('Customer360 targeted history already applied')
          else:
              raise SystemExit('Customer360 evaluation history block did not match expected source')
          PY
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          code=${PIPESTATUS[0]}
          echo "TYPECHECK_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit "$code"
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore
      - name: Build
        run: npm run build
      - name: Commit bounded page reads
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 237
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- src/pages/ShiftNotes.tsx src/pages/Customer360.tsx; then
            echo 'Bounded page reads already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ShiftNotes.tsx src/pages/Customer360.tsx
          git commit -m 'perf: bound shift notes and customer profile reads'
          git push origin "HEAD:${HEAD_BRANCH}"
