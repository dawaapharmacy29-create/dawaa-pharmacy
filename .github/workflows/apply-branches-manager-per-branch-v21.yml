name: Apply branches manager per-branch V21
on:
  push:
    branches: [agent/branches-manager-per-branch-tasks-v21]
    paths:
      - scripts/apply-branches-manager-per-branch-v21.cjs
      - .github/workflows/apply-branches-manager-per-branch-v21.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/branches-manager-per-branch-tasks-v21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-branches-manager-per-branch-v21.cjs
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DailyManagerChecklist.tsx src/lib/evaluations/managerDailyTasks.ts src/lib/evaluations/managerEvaluationService.ts src/lib/evaluations/managerScoreBreakdown.ts src/lib/evaluations/managerLiveIncentiveService.ts src/pages/WeeklyManagerEvaluation.tsx src/lib/evaluations/managerMonthlyReportService.ts
          git commit -m "feat: split branches manager tasks and scoring by branch"
          git push
