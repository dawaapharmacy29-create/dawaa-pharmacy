name: Apply Doctor Dashboard Current Cycle V26

on:
  push:
    branches:
      - agent/doctor-dashboard-current-cycle-v26

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[doctor-dashboard-current-cycle-v26-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: node scripts/apply-doctor-dashboard-current-cycle-v26.cjs
      - run: npm run typecheck
      - run: npm run build
      - name: Commit applied doctor dashboard fix
        run: |
          if git diff --quiet -- src/lib/salesAnalyticsSummaryService.ts src/pages/DoctorDashboardStable.tsx; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/salesAnalyticsSummaryService.ts src/pages/DoctorDashboardStable.tsx
          git commit -m "fix: restore doctor dashboard current-cycle truth [doctor-dashboard-current-cycle-v26-applied]"
          git push
