name: Apply reviews full editor patch

on:
  push:
    branches:
      - fix/reviews-full-details-editor
    paths:
      - '.github/workflows/apply-reviews-full-editor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reviews-full-details-editor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_reviews_full_editor.py
      - name: Remove one-off patch helpers
        run: |
          rm scripts/patch_reviews_full_editor.py
          rm .github/workflows/apply-reviews-full-editor.yml
      - name: Commit patched review page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore full review details and full manager editor"
          git push origin HEAD:fix/reviews-full-details-editor
