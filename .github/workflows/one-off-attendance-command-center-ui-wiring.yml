name: One-off Attendance Command Center UI Wiring

on:
  push:
    branches:
      - feat/delivery-payroll-current-cutover-20261008
    paths:
      - 'scripts/apply-attendance-command-center-ui-wiring-once.cjs'
      - '.github/workflows/one-off-attendance-command-center-ui-wiring.yml'

permissions:
  contents: write

concurrency:
  group: one-off-attendance-command-center-ui-wiring
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/delivery-payroll-current-cutover-20261008
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact anchored patch
        run: node scripts/apply-attendance-command-center-ui-wiring-once.cjs
      - name: Diff safety
        run: git diff --check
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Command center contract guard
        run: node scripts/check-attendance-command-center-contract-wiring.cjs
      - name: Priority comparator unit tests
        run: npx vitest run src/lib/attendance/__tests__/attendanceReviewPriority.test.ts
      - name: TypeScript
        run: npm run typecheck
      - name: Vite production bundle
        run: npx vite build --configLoader runner
      - name: Remove one-off automation and commit tested product diff
        shell: bash
        run: |
          rm scripts/apply-attendance-command-center-ui-wiring-once.cjs
          rm .github/workflows/one-off-attendance-command-center-ui-wiring.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use canonical attendance priority metadata in command center UI'
          git push origin HEAD:feat/delivery-payroll-current-cutover-20261008
