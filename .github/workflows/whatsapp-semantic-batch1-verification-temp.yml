name: WhatsApp Continuation Verification (Temporary)

on:
  push:
    branches:
      - fix/whatsapp-master-brain-lifecycle-v4-continuation-20261017

concurrency:
  group: whatsapp-continuation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Capture exact full verify failure
        shell: bash
        run: |
          set +e
          npm run verify > /tmp/verify.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            mkdir -p docs/whatsapp-master-brain-lifecycle-v4-20261017
            {
              echo "VERIFY_FAILURE_DIAGNOSTIC_TMP"
              echo "head=${GITHUB_SHA}"
              echo "status=${status}"
              echo
              grep -E 'FAIL|failed|Failed|Error:|AssertionError|TypeError|ReferenceError|TS[0-9]{4}|Test Files|Tests|ELIFECYCLE|npm error|✗|×' /tmp/verify.log | tail -n 180 || true
            } > docs/whatsapp-master-brain-lifecycle-v4-20261017/VERIFY_FAILURE_TMP.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/whatsapp-master-brain-lifecycle-v4-20261017/VERIFY_FAILURE_TMP.txt
            git commit -m "chore(si): capture temporary verify failure diagnostic"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          exit "$status"
