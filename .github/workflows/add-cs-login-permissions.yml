name: Add customer service login permissions

on:
  push:
    branches:
      - feature/doctor-dashboard-charts-permission-fix
    paths:
      - .github/workflows/add-cs-login-permissions.yml

permissions:
  contents: write

jobs:
  update-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add full login permissions for customer service manager
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/core/permissionSystem.ts')
          s = p.read_text()
          marker = "  'view_shift_performance',\n"
          additions = "  'create_leave_request',\n  'record_attendance',\n"
          if "  'create_leave_request',\n" not in s or "  'record_attendance',\n" not in s:
              if marker not in s:
                  raise SystemExit('customer_service_manager permission marker not found')
              s = s.replace(marker, marker + additions, 1)
              p.write_text(s)
          PY

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build without prebuild scripts
        run: npm run build --ignore-scripts

      - name: Remove temporary workflow
        run: rm -f .github/workflows/add-cs-login-permissions.yml

      - name: Commit tested permission update
        run: |
          git config user.name "Dawaa Pharmacy Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/core/permissionSystem.ts .github/workflows/add-cs-login-permissions.yml
          git commit -m "fix(auth): allow CS manager leave requests and attendance login"
          git push origin HEAD:feature/doctor-dashboard-charts-permission-fix

# trigger: full CS login permissions
