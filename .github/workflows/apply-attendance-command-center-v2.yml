name: Apply attendance command center v2

on:
  push:
    branches:
      - feat/attendance-operations-center-v2
    paths:
      - scripts/patch-attendance-command-center-v2.cjs
      - .github/workflows/apply-attendance-command-center-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attendance-operations-center-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply one-time source patch
        run: node scripts/patch-attendance-command-center-v2.cjs
      - name: Commit generated source
        run: |
          if git diff --quiet -- src/pages/AttendanceReport.tsx; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AttendanceReport.tsx
          git commit -m "feat: wire attendance sync command center"
          git push origin HEAD:feat/attendance-operations-center-v2
