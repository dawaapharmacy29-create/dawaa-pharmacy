name: Apply doctor clean truth v25

on:
  push:
    branches:
      - agent/doctor-dashboard-sales-truth-v25

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[doctor-clean-truth-v25-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/doctor-dashboard-sales-truth-v25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply transform
        run: node scripts/apply-doctor-clean-truth-v25.cjs
      - name: Remove temporary transform files
        run: rm -f scripts/apply-doctor-clean-truth-v25.cjs .github/workflows/apply-doctor-clean-truth-v25.yml
      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/salesAnalyticsSummaryService.ts src/pages/DoctorDashboardStable.tsx scripts/apply-doctor-clean-truth-v25.cjs .github/workflows/apply-doctor-clean-truth-v25.yml
          git commit -m "fix: align doctor dashboards with clean sales truth [doctor-clean-truth-v25-applied]"
          git push origin HEAD:agent/doctor-dashboard-sales-truth-v25
