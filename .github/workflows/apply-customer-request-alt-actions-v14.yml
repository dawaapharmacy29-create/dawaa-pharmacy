name: Apply customer request alternative actions V14

on:
  push:
    branches:
      - agent/customer-request-alt-actions-v14

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[alt-actions-v14-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-request-alt-actions-v14
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply alternative actions transformation
        run: node scripts/apply-customer-request-alt-actions-v14.cjs
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomerRequests.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "إضافة إجراءات بديلة سريعة لطلبات العملاء [alt-actions-v14-applied]"
          git push origin HEAD:agent/customer-request-alt-actions-v14
