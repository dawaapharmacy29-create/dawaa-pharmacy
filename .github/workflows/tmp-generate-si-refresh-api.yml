name: TEMP Generate SI Refresh API

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Generate canonical API bundle
        run: node scripts/build-sales-intelligence-refresh-api.cjs
      - name: Emit generated bundle
        shell: bash
        run: |
          echo "DAWAA_GENERATED_API_BEGIN"
          gzip -c api/sales-intelligence-refresh-source.js | base64 -w 0
          echo
          echo "DAWAA_GENERATED_API_END"
