name: Apply canonical time-off readers
on:
  push:
    branches: [feat/canonical-timeoff-attendance-foundation]
    paths:
      - scripts/refactor-canonical-timeoff-readers.cjs
      - .github/workflows/apply-canonical-timeoff-readers.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-timeoff-attendance-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refactor-canonical-timeoff-readers.cjs
      - run: |
          if git diff --quiet -- src/pages/Schedule.tsx src/lib/staffDetailLoader.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Schedule.tsx src/lib/staffDetailLoader.ts
          git commit -m "refactor: read schedule time-off from canonical service"
          git push origin HEAD:feat/canonical-timeoff-attendance-foundation
