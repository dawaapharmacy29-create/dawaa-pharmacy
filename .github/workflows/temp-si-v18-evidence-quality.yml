name: Temp SI V18 Evidence Quality

on:
  push:
    branches:
      - fix/si-quality-closing-continuation-20261004
    paths:
      - '.github/workflows/temp-si-v18-evidence-quality.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/si-quality-closing-continuation-20261004
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply V18 evidence-quality repair
        env:
          PATCH_B64: "PLACEHOLDER"
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/apply_v18.py
          python /tmp/apply_v18.py
      - name: Focused V18 regression
        run: npx vitest run src/lib/__tests__/salesIntelligenceEvidenceAvailability.test.ts
      - name: Full repository tests
        run: node scripts/run-tests.cjs
      - name: TypeScript gate
        run: npx tsc --noEmit
      - name: Regenerate Sales Intelligence API
        run: node scripts/build-sales-intelligence-refresh-api.cjs
      - name: Verify generated API carries V18
        run: |
          grep -q "sales-intelligence-v18" api/sales-intelligence-refresh-source.js
          grep -q "attribution-v8-unresolved-product-evidence-safe" api/sales-intelligence-refresh-source.js
          grep -q "matching-v3-unresolved-product-evidence-safe" api/sales-intelligence-refresh-source.js
      - name: Production build
        run: npm run build
      - name: Commit verified V18 and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temp-si-v18-evidence-quality.yml
          git add -A
          git commit -m "fix: treat unresolved media identity as unavailable evidence"
          git push origin HEAD:fix/si-quality-closing-continuation-20261004
